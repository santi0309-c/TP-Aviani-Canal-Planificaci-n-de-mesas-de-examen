services:
  # Backend: API REST con FastAPI (Uvicorn)
  - type: web
    name: tp-mesas-backend
    runtime: python
    region: ohio
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m app.ml.train --data data/pares_materias.csv --out models/modelo.joblib
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # Frontend: React + Vite (Static Site - no region, no plan)
  - type: web
    name: tp-mesas-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tp-mesas-backend
          property: host
